<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Vistoria digital de veículo</title>
  <desc id="desc">Ilustração tecnológica verde de um carro sendo fotografado e verificado digitalmente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031f1a"/>
      <stop offset="0.55" stop-color="#07382f"/>
      <stop offset="1" stop-color="#021713"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dffff4"/>
      <stop offset="0.48" stop-color="#6bd8b7"/>
      <stop offset="1" stop-color="#16856f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ffe5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#143f38" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#58f0c2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#58f0c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#82e8cc" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="820" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="820" rx="44" fill="url(#grid)"/>
  <ellipse cx="600" cy="440" rx="470" ry="330" fill="url(#halo)"/>
  <path d="M0 675L1200 270M0 770L1200 365M84 820L1200 445M0 590L920 280" stroke="#73d9bd" stroke-opacity=".055" stroke-width="2"/>

  <!-- floating photo card left -->
  <g transform="translate(92 146) rotate(-5 165 105)">
    <rect width="330" height="210" rx="28" fill="#062b25" stroke="#58caaa" stroke-opacity=".55" stroke-width="2"/>
    <rect x="18" y="18" width="294" height="174" rx="20" fill="#0b4439"/>
    <path d="M60 142c26-43 61-64 106-64 46 0 83 20 112 62" fill="none" stroke="#8af2d4" stroke-width="8" stroke-linecap="round" opacity=".72"/>
    <circle cx="86" cy="145" r="18" fill="#061e1a" stroke="#8af2d4" stroke-width="5"/>
    <circle cx="258" cy="145" r="18" fill="#061e1a" stroke="#8af2d4" stroke-width="5"/>
    <path d="M245 46h35v35M82 46H47v35M245 166h35v-35M82 166H47v-35" fill="none" stroke="#d8fff3" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- floating photo card right -->
  <g transform="translate(810 118) rotate(6 145 95)">
    <rect width="292" height="190" rx="27" fill="#082e27" stroke="#6be3c1" stroke-opacity=".6" stroke-width="2"/>
    <rect x="18" y="18" width="256" height="154" rx="18" fill="#0a3b32"/>
    <path d="M54 126c33-50 73-72 123-64 29 5 54 21 75 48" fill="none" stroke="#9affdf" stroke-width="8" stroke-linecap="round" opacity=".72"/>
    <circle cx="226" cy="56" r="31" fill="#0a6e5c" stroke="#9affdf" stroke-width="3"/>
    <path d="m211 56 10 10 19-23" fill="none" stroke="#e7fff8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- central scan frame -->
  <g filter="url(#glow)" opacity=".8" stroke="#6de6c4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M364 305v-54h58M836 251h58v54M364 610v54h58M894 610v54h-58"/>
  </g>
  <rect x="374" y="260" width="516" height="390" rx="42" fill="#071f1c" fill-opacity=".2" stroke="#66d9b8" stroke-opacity=".28" stroke-width="2" stroke-dasharray="10 13"/>

  <!-- vehicle -->
  <g transform="translate(0 12)">
    <ellipse cx="626" cy="586" rx="278" ry="44" fill="#000" opacity=".36" filter="url(#soft)"/>
    <path d="M387 535c18-70 43-123 83-161 30-29 82-47 147-52l126 6c67 4 108 30 142 79 19 27 36 67 48 119l-29 49c-13 22-41 35-72 35H459c-39 0-69-17-82-46z" fill="#0b4d41" stroke="url(#car)" stroke-width="7"/>
    <path d="M501 379c23-27 61-41 114-45l111 5c39 2 70 17 91 45l28 42H472z" fill="url(#glass)" stroke="#91efd5" stroke-opacity=".65" stroke-width="4"/>
    <path d="M640 337v91M476 431h369" fill="none" stroke="#c9fff0" stroke-opacity=".35" stroke-width="3"/>
    <path d="M418 513c80-21 158-32 235-32 87 0 173 12 257 36" fill="none" stroke="#97f5db" stroke-opacity=".55" stroke-width="4"/>
    <path d="M452 532h88M762 532h92" stroke="#dffff5" stroke-width="13" stroke-linecap="round" opacity=".8" filter="url(#glow)"/>
    <path d="M590 522h101" stroke="#6ee1c0" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <circle cx="487" cy="568" r="49" fill="#031a16" stroke="#69d9ba" stroke-width="7"/>
    <circle cx="487" cy="568" r="20" fill="#77e6c8" opacity=".65"/>
    <circle cx="817" cy="568" r="49" fill="#031a16" stroke="#69d9ba" stroke-width="7"/>
    <circle cx="817" cy="568" r="20" fill="#77e6c8" opacity=".65"/>
  </g>

  <!-- camera scanner -->
  <g transform="translate(530 180)" filter="url(#glow)">
    <rect x="0" y="22" width="142" height="92" rx="24" fill="#0c6655" stroke="#a8ffe5" stroke-width="4"/>
    <path d="M34 22 48 0h47l15 22" fill="#0c6655" stroke="#a8ffe5" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="72" cy="68" r="28" fill="#03231d" stroke="#a8ffe5" stroke-width="5"/>
    <circle cx="72" cy="68" r="12" fill="#78e4c5"/>
    <circle cx="119" cy="42" r="5" fill="#dffff5"/>
  </g>

  <!-- scan line + nodes -->
  <path d="M386 484H888" stroke="#8bffdd" stroke-width="3" stroke-dasharray="8 12" opacity=".75" filter="url(#glow)"/>
  <g fill="#dffff5" stroke="#55d2ad" stroke-width="3">
    <circle cx="429" cy="484" r="7"/><circle cx="546" cy="484" r="7"/><circle cx="665" cy="484" r="7"/><circle cx="785" cy="484" r="7"/><circle cx="856" cy="484" r="7"/>
  </g>

  <!-- status chip -->
  <g transform="translate(430 690)">
    <rect width="340" height="64" rx="32" fill="#063a31" stroke="#73dfc0" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="42" cy="32" r="18" fill="#0d7a64"/>
    <path d="m33 32 7 7 12-15" fill="none" stroke="#e5fff7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="40" fill="#dffff5" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="2">VISTORIA REGISTRADA</text>
  </g>

  <!-- metallic highlight -->
  <path d="M66 70H434" stroke="#a7ffe4" stroke-opacity=".28" stroke-width="3"/>
  <path d="M1006 746h128" stroke="#a7ffe4" stroke-opacity=".22" stroke-width="3"/>
</svg>