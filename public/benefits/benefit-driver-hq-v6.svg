<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="t d"><title id="t">Para motoristas de app</title><desc id="d">Carro premium, celular com ganhos, rota urbana e localização em cenário verde neon.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031914"/><stop offset=".48" stop-color="#06392f"/><stop offset="1" stop-color="#010d0b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edfff9"/><stop offset=".18" stop-color="#88dfc5"/><stop offset=".43" stop-color="#163d35"/><stop offset=".68" stop-color="#baffea"/><stop offset="1" stop-color="#0b5144"/></linearGradient><linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a241f"/><stop offset=".26" stop-color="#0d8068"/><stop offset=".52" stop-color="#57c6a6"/><stop offset=".7" stop-color="#0b5c4c"/><stop offset="1" stop-color="#031512"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cefff2" stop-opacity=".72"/><stop offset=".38" stop-color="#397366" stop-opacity=".42"/><stop offset="1" stop-color="#031814" stop-opacity=".9"/></linearGradient><radialGradient id="halo"><stop stop-color="#49dfaF" stop-opacity=".34"/><stop offset="1" stop-color="#49dfaf" stop-opacity="0"/></radialGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".58"/></filter><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#79e6c6" stroke-opacity=".045"/></pattern></defs><rect width="1200" height="960" rx="52" fill="url(#bg)"/><rect width="1200" height="960" rx="52" fill="url(#grid)"/><ellipse cx="630" cy="505" rx="530" ry="4