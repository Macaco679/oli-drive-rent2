<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="t d">
<title id="t">Contratos digitais</title><desc id="d">Contrato digital em vidro, escudo metálico e chave automotiva em cenário verde neon.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031a17"/><stop offset=".52" stop-color="#073b33"/><stop offset="1" stop-color="#020e0c"/></linearGradient>
<radialGradient id="halo" cx="48%" cy="42%" r="58%"><stop stop-color="#39d7ae" stop-opacity=".34"/><stop offset="1" stop-color="#39d7ae" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eafff9"/><stop offset=".18" stop-color="#79d9bf"/><stop offset=".42" stop-color="#183f39"/><stop offset=".65" stop-color="#aaf8e3"/><stop offset="1" stop-color="#0c5447"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ff4da" stop-opacity=".32"/><stop offset=".5" stop-color="#0b4e42" stop-opacity=".64"/><stop offset="1" stop-color="#021c18" stop-opacity=".88"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c5b4d"/><stop offset="1" stop-color="#041f1b"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8af2d4" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="960" rx="52" fill="url(#bg)"/><rect width="1200" height="960" rx="52" fill="url(#grid)"/><ellipse cx="650" cy="470" rx="540" ry="430" fill="url(#halo)"/>
