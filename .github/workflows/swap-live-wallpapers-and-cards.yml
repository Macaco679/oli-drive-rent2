name: Swap live wallpapers and redesign benefit cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/swap-live-wallpapers-and-cards.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply wallpaper swap and visual redesign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          organic = 'https://moewalls.com/wp-content/uploads/2021/11/abstract-organic-lines.mp4'
          r34 = '/videos/hero-r34-tunnel.mp4'

          home_path = Path('src/pages/Home.tsx')
          layout_path = Path('src/components/layout/WebLayout.tsx')
          guard_path = Path('src/lib/persistentBackgroundVideos.ts')
          main_path = Path('src/main.tsx')

          home = home_path.read_text()
          layout = layout_path.read_text()
          guard = guard_path.read_text()
          main = main_path.read_text()

          home = re.sub(r'src="(?:/videos/hero-r34-tunnel\.mp4|https://moewalls\.com/wp-content/uploads/2021/11/abstract-organic-lines\.mp4)"', f'src="{organic}"', home, count=1)
          home = home.replace('className="absolute inset-0 bg-gradient-to-br from-primary/20 to-accent/15"', 'className="hero-video-overlay absolute inset-0"', 1)
          layout = re.sub(r'const FOOTER_LIVE_WALLPAPER = "[^"]+";', f'const FOOTER_LIVE_WALLPAPER = "{r34}";', layout, count=1)

          guard = re.sub(r'const TOP_HERO_SOURCE = "[^"]+";', f'const TOP_HERO_SOURCE = "{organic}";', guard, count=1)
          if 'const FOOTER_SOURCE =' in guard:
              guard = re.sub(r'const FOOTER_SOURCE = "[^"]+";', f'const FOOTER_SOURCE = "{r34}";', guard, count=1)
          else:
              guard = guard.replace(f'const TOP_HERO_SOURCE = "{organic}";', f'const TOP_HERO_SOURCE = "{organic}";\nconst FOOTER_SOURCE = "{r34}";', 1)

          source_block = '''  if (isTopHero(video) && video.getAttribute("src") !== TOP_HERO_SOURCE) {\n    video.setAttribute("src", TOP_HERO_SOURCE);\n    video.removeAttribute("poster");\n    video.load();\n  }'''
          source_block_with_footer = '''  if (isTopHero(video) && video.getAttribute("src") !== TOP_HERO_SOURCE) {\n    video.setAttribute("src", TOP_HERO_SOURCE);\n    video.removeAttribute("poster");\n    video.load();\n  }\n\n  const footer = document.querySelector<HTMLVideoElement>("footer video");\n  if (footer === video && video.getAttribute("src") !== FOOTER_SOURCE) {\n    video.setAttribute("src", FOOTER_SOURCE);\n    video.removeAttribute("poster");\n    video.load();\n  }'''
          if 'video.getAttribute("src") !== FOOTER_SOURCE' not in guard:
              if source_block not in guard:
                  raise SystemExit('Playback guard source block not found')
              guard = guard.replace(source_block, source_block_with_footer, 1)

          style_import = 'import "./styles/home-v3.css";'
          if style_import not in main:
              main = main.replace('import "./styles/metallic-refresh.css";', 'import "./styles/metallic-refresh.css";\n' + style_import, 1)

          home_path.write_text(home)
          layout_path.write_text(layout)
          guard_path.write_text(guard)
          main_path.write_text(main)
          PY

          cat > src/styles/home-v3.css <<'CSS'
          .hero-video-overlay {
            background: linear-gradient(90deg, hsl(177 65% 7% / .72), hsl(174 54% 11% / .48) 48%, hsl(172 52% 9% / .56)), radial-gradient(circle at 72% 26%, hsl(158 58% 48% / .13), transparent 40%);
          }

          section[class~="bg-secondary/30"] + section {
            background: radial-gradient(circle at 50% -20%, hsl(158 54% 68% / .10), transparent 42%), repeating-linear-gradient(112deg, transparent 0 86px, hsl(171 33% 30% / .025) 87px, transparent 88px 174px), linear-gradient(180deg, hsl(210 17% 96%), hsl(167 18% 91%)) !important;
          }

          section[class~="bg-secondary/30"] + section h2 { position: relative; width: fit-content; margin-inline: auto; padding-bottom: .8rem; }
          section[class~="bg-secondary/30"] + section h2::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 4.75rem; height: 2px; transform: translateX(-50%); border-radius: 99px; background: linear-gradient(90deg, transparent, hsl(170 58% 25%), hsl(151 69% 69%), hsl(168 54% 31%), transparent); box-shadow: 0 0 14px hsl(158 56% 42% / .2); }

          section[class~="bg-secondary/30"] + section .grid > div {
            position: relative; isolation: isolate; overflow: hidden; min-height: 13.25rem; padding: 1.8rem 1.75rem 1.7rem !important; border: 1px solid transparent !important; border-radius: 1.45rem !important;
            background: linear-gradient(145deg, hsl(175 35% 21% / .965), hsl(177 39% 15% / .985) 52%, hsl(168 31% 22% / .97)) padding-box, linear-gradient(120deg, hsl(176 68% 25%), hsl(156 62% 53%) 28%, hsl(148 72% 78%) 48%, hsl(164 58% 42%) 66%, hsl(177 67% 20%)) border-box !important;
            box-shadow: inset 0 1px 0 hsl(0 0% 100% / .08), inset 0 -1px 0 hsl(177 72% 6% / .5), 0 16px 36px hsl(177 54% 9% / .16) !important; text-align: left !important; transition: transform 240ms ease, box-shadow 240ms ease, filter 240ms ease !important;
          }
          section[class~="bg-secondary/30"] + section .grid > div::before { content: ''; position: absolute; z-index: 0; inset: 0; width: auto; border-radius: inherit; background: linear-gradient(108deg, transparent 0 35%, hsl(0 0% 100% / .035) 45%, transparent 56%), radial-gradient(circle at 88% 8%, hsl(153 68% 62% / .12), transparent 30%); box-shadow: none; pointer-events: none; }
          section[class~="bg-secondary/30"] + section .grid > div::after { content: ''; position: absolute; z-index: 0; left: 1.7rem; right: 1.7rem; top: 0; width: auto; height: 2px; border-radius: 99px; background: linear-gradient(90deg, transparent, hsl(151 73% 78% / .9), hsl(164 62% 48% / .75), transparent); box-shadow: 0 0 14px hsl(157 62% 48% / .18); }
          section[class~="bg-secondary/30"] + section .grid > div > * { position: relative; z-index: 1; }
          section[class~="bg-secondary/30"] + section .grid > div:hover { transform: translateY(-5px); filter: saturate(1.06) brightness(1.035); box-shadow: inset 0 1px 0 hsl(0 0% 100% / .10), 0 24px 48px hsl(177 58% 8% / .23), 0 0 0 1px hsl(153 64% 65% / .16) !important; }
          section[class~="bg-secondary/30"] + section .grid > div > div:first-child { width: 3.25rem !important; height: 3.25rem !important; margin: 0 0 1.15rem !important; border: 1px solid hsl(151 65% 72% / .36) !important; border-radius: 1rem !important; color: white !important; background: linear-gradient(145deg, hsl(176 58% 17%), hsl(163 50% 35%)) !important; box-shadow: inset 0 1px 0 hsl(0 0% 100% / .14), 0 10px 22px hsl(177 65% 7% / .30), 0 0 18px hsl(158 55% 48% / .08) !important; }
          section[class~="bg-secondary/30"] + section .grid > div h3 { color: hsl(0 0% 100% / .97) !important; letter-spacing: -.025em !important; }
          section[class~="bg-secondary/30"] + section .grid > div p { color: hsl(165 18% 87% / .78) !important; line-height: 1.62 !important; }
          section[class~="bg-secondary/30"] + section .grid > div svg { color: white !important; }

          footer.site-live-footer > video { filter: saturate(1.1) contrast(1.1) brightness(.74) !important; transform: scale(1.01) !important; }
          footer.site-live-footer .footer-video-overlay { background: radial-gradient(circle at 18% 28%, hsl(158 55% 42% / .08), transparent 34%), linear-gradient(100deg, hsl(178 72% 4% / .70), hsl(176 60% 6% / .46) 48%, hsl(178 72% 4% / .72)) !important; }
          footer.site-live-footer .site-shell { text-shadow: 0 2px 14px hsl(178 88% 3% / .65); }
          CSS

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/swap-live-wallpapers-and-cards.yml
          git add -A
          git commit -m 'style: swap wallpapers and modernize benefit cards'
          git push origin HEAD:main
