name: Replace top hero with original R34 wallpaper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-top-hero-r34.yml

permissions:
  contents: write

jobs:
  replace-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact original 4K wallpaper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import hashlib, html, re, subprocess

          PAGE = 'https://moewalls.com/vehicle/nissan-skyline-gt-r-r34-in-the-tunnel-live-wallpaper/'
          EXPECTED_SHA256 = 'c557d158faaacd66f5a7119949bca15b3bea0875476610f440ba03fcc4e93206'
          EXPECTED_SIZE = 42331762
          OUT = Path('public/videos/hero-r34-tunnel.mp4')
          OUT.parent.mkdir(parents=True, exist_ok=True)

          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36'
          req = Request(PAGE, headers={'User-Agent': ua, 'Accept-Language': 'en-US,en;q=0.9'})
          raw = urlopen(req, timeout=45).read().decode('utf-8', 'ignore')
          raw = html.unescape(raw.replace('\\/', '/'))

          candidates = []
          patterns = [
              r'https?://[^\\s\"\'<>]+?\\.mp4(?:\\?[^\\s\"\'<>]*)?',
              r'(?:src|href|data-src|data-video)=[\"\']([^\"\']+?\\.mp4(?:\\?[^\"\']*)?)[\"\']',
          ]
          for pattern in patterns:
              for match in re.finditer(pattern, raw, re.I):
                  value = match.group(1) if match.lastindex else match.group(0)
                  candidates.append(urljoin(PAGE, value))

          candidates += [
              'https://moewalls.com/wp-content/uploads/2023/02/nissan-skyline-gt-r-r34-in-the-tunnel.mp4',
              'https://moewalls.com/wp-content/uploads/2023/02/Nissan-Skyline-GT-R-R34-In-The-Tunnel.mp4',
              'https://moewalls.com/wp-content/uploads/2023/02/nissan-skyline-gtr-r34-in-the-tunnel.mp4',
              'https://moewalls.com/wp-content/uploads/2023/02/Nissan-Skyline-GTR-R34-In-The-Tunnel.mp4',
              'https://moewalls.com/wp-content/uploads/2023/02/nissan-skyline-gt-r-r34-in-the-tunnel-live-wallpaper.mp4',
              'https://moewalls.com/wp-content/uploads/2023/02/Nissan-Skyline-GT-R-R34-In-The-Tunnel-Live-Wallpaper.mp4',
          ]

          seen = set()
          ordered = []
          for url in candidates:
              if url not in seen:
                  seen.add(url)
                  ordered.append(url)

          print('Candidate count:', len(ordered))
          for url in ordered:
              tmp = Path('/tmp/r34-candidate.mp4')
              try:
                  subprocess.run([
                      'curl', '-L', '--fail', '--silent', '--show-error', '--retry', '2',
                      '-A', ua, '-o', str(tmp), url
                  ], check=True, timeout=180)
              except Exception as exc:
                  print('skip', url, exc)
                  continue

              size = tmp.stat().st_size if tmp.exists() else 0
              digest = hashlib.sha256(tmp.read_bytes()).hexdigest() if size else ''
              print('candidate', url, 'size=', size, 'sha256=', digest)
              if size == EXPECTED_SIZE and digest == EXPECTED_SHA256:
                  tmp.replace(OUT)
                  print('MATCHED EXACT ORIGINAL:', url)
                  break
          else:
              raise SystemExit('Could not locate the exact user-supplied 4K MP4; refusing to substitute or recompress it.')
          PY

      - name: Create a matching poster without touching video bytes
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -ss 00:00:02 -i public/videos/hero-r34-tunnel.mp4 -frames:v 1 -q:v 2 public/videos/hero-r34-tunnel-poster.jpg

      - name: Update only the top hero and metallic card outlines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          home_path = Path('src/pages/Home.tsx')
          css_path = Path('src/styles/metallic-refresh.css')
          home = home_path.read_text()
          css = css_path.read_text()

          old_video = 'src="/videos/hero-background.mp4"\n          poster="/videos/hero-background-poster.jpg"'
          new_video = 'src="/videos/hero-r34-tunnel.mp4"\n          poster="/videos/hero-r34-tunnel-poster.jpg"'
          if old_video not in home:
              raise SystemExit('Top hero video fragment not found; footer intentionally remains untouched.')
          home = home.replace(old_video, new_video, 1)

          marker = '/* BENEFITS — frosted mineral panels with a green metallic edge, no pure white cards. */'
          if marker not in css:
              raise SystemExit('Benefits CSS marker not found')
          before, benefits = css.split(marker, 1)

          old_block = '''  border: 1px solid hsl(var(--metal-line) / 0.32);\n  border-radius: 1.35rem;\n  background:\n    radial-gradient(circle at 95% 0%, hsl(var(--metal-bright) / 0.12), transparent 34%),\n    linear-gradient(145deg, hsl(166 23% 93% / 0.96), hsl(210 17% 96% / 0.94)) !important;\n  box-shadow:\n    inset 0 1px 0 hsl(0 0% 100% / 0.82),\n    0 14px 34px hsl(var(--metal-deep) / 0.08);'''
          new_block = '''  border: 2px solid transparent;\n  border-radius: 1.35rem;\n  background:\n    radial-gradient(circle at 95% 0%, hsl(var(--metal-bright) / 0.15), transparent 34%) padding-box,\n    linear-gradient(145deg, hsl(166 23% 93% / 0.97), hsl(210 17% 96% / 0.95)) padding-box,\n    linear-gradient(118deg,\n      hsl(174 63% 18%),\n      hsl(158 58% 52%),\n      hsl(151 72% 78%),\n      hsl(171 57% 31%),\n      hsl(158 58% 55%)) border-box !important;\n  box-shadow:\n    inset 0 1px 0 hsl(0 0% 100% / 0.84),\n    0 0 0 1px hsl(161 58% 42% / 0.16),\n    0 14px 34px hsl(var(--metal-deep) / 0.1),\n    0 8px 28px hsl(158 54% 38% / 0.08);'''
          if old_block not in benefits:
              raise SystemExit('Benefits card surface block not found')
          benefits = benefits.replace(old_block, new_block, 1)

          old_hover = '''  border-color: hsl(var(--metal-line) / 0.56);\n  box-shadow: 0 22px 44px hsl(var(--metal-deep) / 0.13);'''
          new_hover = '''  border-color: transparent;\n  box-shadow:\n    0 0 0 1px hsl(153 67% 67% / 0.34),\n    0 0 24px hsl(157 58% 48% / 0.16),\n    0 22px 44px hsl(var(--metal-deep) / 0.15);'''
          if old_hover not in benefits:
              raise SystemExit('Benefits hover block not found')
          benefits = benefits.replace(old_hover, new_hover, 1)

          home_path.write_text(home)
          css_path.write_text(before + marker + benefits)
          PY

      - name: Verify original video was not recompressed
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s public/videos/hero-r34-tunnel.mp4)" = "42331762"
          echo "c557d158faaacd66f5a7119949bca15b3bea0875476610f440ba03fcc4e93206  public/videos/hero-r34-tunnel.mp4" | sha256sum -c -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 public/videos/hero-r34-tunnel.mp4

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit final assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/replace-top-hero-r34.yml
          git add public/videos/hero-r34-tunnel.mp4 public/videos/hero-r34-tunnel-poster.jpg src/pages/Home.tsx src/styles/metallic-refresh.css
          git commit -m 'style: use original R34 4K wallpaper in top hero'
          git push origin HEAD:main
