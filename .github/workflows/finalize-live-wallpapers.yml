name: Finalize continuous live wallpapers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-live-wallpapers.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact R34 asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s public/videos/hero-r34-tunnel.mp4)" = "42331762"
          echo "c557d158faaacd66f5a7119949bca15b3bea0875476610f440ba03fcc4e93206  public/videos/hero-r34-tunnel.mp4" | sha256sum -c -

      - name: Use R34 only in top hero and enable playback guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          home_path = Path('src/pages/Home.tsx')
          main_path = Path('src/main.tsx')
          home = home_path.read_text()
          main = main_path.read_text()

          old = 'src="/videos/hero-background.mp4"\n          poster="/videos/hero-background-poster.jpg"'
          new = 'src="/videos/hero-r34-tunnel.mp4"'
          if old in home:
              home = home.replace(old, new, 1)
          elif 'src="/videos/hero-r34-tunnel.mp4"' not in home:
              raise SystemExit('Top hero video source was not found')

          pos = home.find('src="/videos/hero-r34-tunnel.mp4"')
          preload = home.find('preload="metadata"', pos, pos + 1000)
          if preload >= 0:
              home = home[:preload] + 'preload="auto"' + home[preload + len('preload="metadata"'):]
          home_path.write_text(home)

          guard_import = 'import "./lib/persistentBackgroundVideos";'
          if guard_import not in main:
              anchor = 'import "./styles/metallic-refresh.css";'
              if anchor not in main:
                  raise SystemExit('main.tsx import anchor missing')
              main = main.replace(anchor, anchor + '\n' + guard_import, 1)
              main_path.write_text(main)
          PY

          mkdir -p src/lib
          cat > src/lib/persistentBackgroundVideos.ts <<'TS'
          const managed = new WeakSet<HTMLVideoElement>();
          const timers = new WeakMap<HTMLVideoElement, number>();
          const selector = 'main > section:first-child video[autoplay][loop], footer video[autoplay][loop]';

          const configure = (video: HTMLVideoElement) => {
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.preload = 'auto';
            video.controls = false;
            video.setAttribute('autoplay', '');
            video.setAttribute('loop', '');
            video.setAttribute('muted', '');
            video.setAttribute('playsinline', '');
            video.setAttribute('preload', 'auto');
          };

          const resume = (video: HTMLVideoElement) => {
            configure(video);
            if (video.ended) {
              try { video.currentTime = 0; } catch { /* metadata may still be loading */ }
            }
            if (!video.paused && !video.ended) return;
            const promise = video.play();
            promise?.catch(() => { /* retried by recovery events/watchdog */ });
          };

          const schedule = (video: HTMLVideoElement, delay = 0) => {
            const previous = timers.get(video);
            if (previous) window.clearTimeout(previous);
            const timer = window.setTimeout(() => {
              timers.delete(video);
              resume(video);
            }, delay);
            timers.set(video, timer);
          };

          const videos = () => Array.from(document.querySelectorAll<HTMLVideoElement>(selector));
          const resumeAll = () => videos().forEach((video) => schedule(video));

          const bind = (video: HTMLVideoElement) => {
            configure(video);
            if (managed.has(video)) {
              schedule(video);
              return;
            }
            managed.add(video);

            ['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough'].forEach((eventName) =>
              video.addEventListener(eventName, () => schedule(video), { passive: true }),
            );
            ['pause', 'ended', 'stalled', 'waiting', 'abort'].forEach((eventName) =>
              video.addEventListener(eventName, () => schedule(video, 80), { passive: true }),
            );
            video.addEventListener('error', () => {
              window.setTimeout(() => {
                try { video.load(); } catch { /* keep current source */ }
                schedule(video, 80);
              }, 400);
            });
            schedule(video);
          };

          const scan = () => videos().forEach(bind);

          if (typeof window !== 'undefined' && typeof document !== 'undefined') {
            const start = () => {
              scan();
              new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
              window.addEventListener('focus', resumeAll, { passive: true });
              window.addEventListener('pageshow', resumeAll, { passive: true });
              window.addEventListener('online', resumeAll, { passive: true });
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') resumeAll();
              });
              window.setInterval(() => {
                videos().forEach((video) => {
                  if (video.paused || video.ended) schedule(video);
                });
              }, 1200);
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', start, { once: true });
            } else {
              start();
            }
          }
          TS

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit final state and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-live-wallpapers.yml
          git add src/pages/Home.tsx src/main.tsx src/lib/persistentBackgroundVideos.ts
          git commit -m 'fix: keep hero and footer wallpapers continuously playing'
          git push origin HEAD:main
