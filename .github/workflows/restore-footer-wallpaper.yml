name: Restore original footer wallpaper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-footer-wallpaper.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect wallpaper source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, urllib.request
          page_url = 'https://moewalls.com/abstract/abstract-organic-lines-live-wallpaper/'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': page_url,
          }
          req = urllib.request.Request(page_url, headers=headers)
          text = urllib.request.urlopen(req, timeout=45).read().decode('utf-8', 'replace')
          text = html.unescape(text).replace('\\/', '/')
          print('HTML_LENGTH', len(text))
          lower = text.lower()
          for needle in ['download wallpaper', 'download', 'preview video', '<video', '<iframe', '.mp4', '.zip', 'wp-content', 'player', 'source']:
              print('\n===== ', needle, ' =====')
              start = 0
              count = 0
              while True:
                  idx = lower.find(needle.lower(), start)
                  if idx < 0 or count >= 12:
                      break
                  print(text[max(0, idx-700):min(len(text), idx+1400)].replace('\n',' '))
                  start = idx + len(needle)
                  count += 1
          print('\n===== INTERESTING URLS =====')
          urls = re.findall(r'https?://[^\\s"\'<>]+', text, re.I)
          for u in dict.fromkeys(urls):
              lu = u.lower()
              if any(k in lu for k in ['download','video','player','stream','cdn','wp-content','mp4','zip','media']):
                  print(u)
          PY
