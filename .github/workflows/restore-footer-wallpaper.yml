name: Restore original footer wallpaper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-footer-wallpaper.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original 4K wallpaper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos
          PAGE='https://moewalls.com/abstract/abstract-organic-lines-live-wallpaper/'
          TOKEN='NDvY%2FAupXwmOeJsJpK4rX3u76gbA07S9kTlVjroWxazC01%2BHgURu74Cg4nB07rlXTpkIQWjybjgC76bC'
          URL="https://go.moewalls.com/download.php?video=${TOKEN}"
          TARGET='public/videos/footer-organic-lines-original.mp4'

          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36' \
            --referer "$PAGE" \
            --output "$TARGET" "$URL"

          test "$(stat -c%s "$TARGET")" = '53467423'
          echo '382d42218ea0e82a37577bce1728f07ee51174ae08ef1b35e138208caa5fe5e6  public/videos/footer-organic-lines-original.mp4' | sha256sum --check --strict

      - name: Commit original MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/footer-organic-lines-original.mp4
          if git diff --cached --quiet; then
            echo 'Original asset already present'
            exit 0
          fi
          git commit -m 'asset: add exact original 4K footer wallpaper'
          git push origin HEAD:main
