name: Restore original footer wallpaper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-footer-wallpaper.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect download response
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://moewalls.com/abstract/abstract-organic-lines-live-wallpaper/'
          URL='https://go.moewalls.com/download.php?video=NDvY%2FAupXwmOeJsJpK4rX3u76gbA07S9kTlVjroWxazC01%2BHgURu74Cg4nB07rlXTpkIQWjybjgC76bC'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          curl -sS -c cookies.txt -b cookies.txt -A "$UA" -H 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' "$PAGE" -o page.html
          curl -sS -D headers.txt -c cookies.txt -b cookies.txt -A "$UA" -e "$PAGE" -H 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' -H 'sec-fetch-site: same-site' -H 'sec-fetch-mode: navigate' -H 'sec-fetch-dest: document' "$URL" -o body.bin || true
          echo '=== HEADERS ==='
          cat headers.txt
          echo '=== SIZE ==='
          wc -c body.bin
          echo '=== TYPE ==='
          file body.bin
          echo '=== BODY ==='
          head -c 12000 body.bin || true
